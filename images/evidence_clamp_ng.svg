<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <linearGradient id="metalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="machinery" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="fixture" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Machine Base Background -->
  <rect width="320" height="280" fill="url(#metalBg)"/>
  
  <!-- Grid Texture / Floor Plate -->
  <path d="M0,40 L320,40 M0,80 L320,80 M0,120 L320,120 M0,160 L320,160 M0,200 L320,200 M0,240 L320,240" stroke="#334155" stroke-width="0.75" opacity="0.4"/>
  
  <!-- Machine Turret / Cylindrical Laser Marking Fixture -->
  <ellipse cx="160" cy="50" rx="90" ry="32" fill="url(#machinery)" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <path d="M70,50 L70,95 Q160,135 250,95 L250,50 Z" fill="url(#machinery)" stroke="#475569" stroke-width="1.5"/>
  <ellipse cx="160" cy="95" rx="90" ry="24" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>

  <!-- Rotating Timing Index Plate -->
  <ellipse cx="160" cy="115" rx="72" ry="20" fill="url(#fixture)" stroke="#0284c7" stroke-width="2"/>
  
  <!-- Industrial Housing Bracket (Orange/Rust industrial painted metal) -->
  <path d="M55,100 L115,100 L115,220 L40,240 L40,140 Z" fill="#b45309" stroke="#78350f" stroke-width="2" opacity="0.9"/>
  <path d="M205,100 L265,100 L280,140 L280,240 L205,220 Z" fill="#9a3412" stroke="#7c2d12" stroke-width="2" opacity="0.85"/>

  <!-- Inspection Clamp Assembly (Improperly Tightened / NG) -->
  <g id="clamp-assembly" transform="translate(110, 118)">
    <!-- Clamp mounting flange -->
    <rect x="10" y="5" width="80" height="18" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Clamp arm / jaw -->
    <path d="M25,23 L75,23 L70,55 L30,55 Z" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <!-- Support Bolt & Magnet shim (restored with magnet) -->
    <rect x="42" y="55" width="16" height="42" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="50" cy="97" rx="12" ry="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="50" y="80" fill="#e2e8f0" font-size="8" font-family="sans-serif" text-anchor="middle" font-weight="bold">NG GAP</text>
  </g>

  <!-- Red Diamond/Polygon Markup Highlight (Exact match to User's Excel Evidence) -->
  <polygon points="105,135 220,105 205,215 130,235" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Red Arrow pointing to improper clamp tightening -->
  <g stroke="#dc2626" fill="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="160" y1="215" x2="160" y2="175" />
    <polygon points="160,165 153,178 167,178" />
  </g>

  <!-- Watermark / Tag Header -->
  <rect x="10" y="10" width="135" height="22" rx="4" fill="rgba(15, 23, 42, 0.85)" stroke="#ef4444" stroke-width="1"/>
  <text x="16" y="25" fill="#f87171" font-size="11" font-family="monospace" font-weight="700">EVIDENCE: CLAMP NG</text>

  <!-- Station Tag -->
  <rect x="220" y="250" width="90" height="20" rx="3" fill="rgba(0,0,0,0.75)"/>
  <text x="265" y="264" fill="#94a3b8" font-size="9.5" font-family="sans-serif" text-anchor="middle">STATION: LASER-01</text>
</svg>
